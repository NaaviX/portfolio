stages:
    - build
    - test
    - docker-build
    - deploy

build:
    stage: build
    image: node
    script:
        - echo "Start building App"
        - npm install
        - npm run build
        - echo "Build successfully!"
    artifacts:
        expire_in: 1 hour
        paths:
            - build
            - node_modules/

test:
    stage: test
    image: node
    script:
        - echo "Testing App"
        - echo "Test successfully!"

docker-build:
    stage: docker-build
    image: docker:latest
    services:
        - name: docker:24.0.7-dind
    before_script:
        - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    script:
        - docker build --pull -t "$CI_REGISTRY_IMAGE" .
        - docker push "$CI_REGISTRY_IMAGE"
        - echo "Registry image:" $CI_REGISTRY_IMAGE

deploy:
    stage: deploy
    image: docker:dind
    before_script:
        - echo $SSH_PRIVATE_KEY
        - 'command -v ssh-agent >/dev/null || ( apk update && apk add openssh)'
        - eval $(ssh-agent -s)
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan $VM_IPADDRESS >> ~/.ssh/known_hosts
        - chmod 644 ~/.ssh/known_hosts
    script:
        - ssh $SSH_USER@$VM_IPADDRESS "hostname && echo 'Welcome!!!' > welcome.txt"
        - ssh $SSH_USER@$VM_IPADDRESS "docker pull registry.gitlab.com/naavix/portfolio"
        - ssh $SSH_USER@$VM_IPADDRESS "docker stop portfoliocontainer || true && docker rm portfoliocontainer || true"
        - ssh $SSH_USER@$VM_IPADDRESS "docker run -p 3001:80 -d --name portfoliocontainer registry.gitlab.com/naavix/portfolio"

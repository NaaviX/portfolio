stages:
    - build
    - test
    - docker-build
    - deploy
    - analyze

build:
    stage: build
    image: node
    script:
        - echo "Start building App"
        - npm install
        - npm run build
        - echo "Build successfully!"
    artifacts:
        expire_in: 1 hour
        paths:
            - build
            - node_modules/

docker-build:
    stage: docker-build
    image: docker:latest
    services:
        - name: docker:24.0.7-dind
    before_script:
        - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    script:
        - docker build --pull -t "$CI_REGISTRY_IMAGE" .
        - docker push "$CI_REGISTRY_IMAGE"
        - echo "Registry image:" $CI_REGISTRY_IMAGE

deploy:
    stage: deploy
    image: kroniak/ssh-client
    before_script:
        - echo "deploying app"
    script:
        - echo $CI_REGISTRY
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > key.pem
        - chmod 400 key.pem
        - ssh -o StrictHostKeyChecking=no -i key.pem $SSH_USER@$VM_IPADDRESS "cd /home/antoine/full-app/portfolio"
        - ssh -o StrictHostKeyChecking=no -i key.pem $SSH_USER@$VM_IPADDRESS "docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY"
        - ssh -o StrictHostKeyChecking=no -i key.pem $SSH_USER@$VM_IPADDRESS "docker compose --file compose.yaml up -d"

sonar-analysis:
    stage: analyze
    image:
        name: sonarsource/sonar-scanner-cli:latest
        entrypoint: ['']
    variables:
        SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
        GIT_DEPTH: '0' # Tells git to fetch all the branches of the project
    cache:
        key: '${CI_JOB_NAME}'
        paths:
            - .sonar/cache
    script:
        - sonar-scanner
    allow_failure: true
    only:
        - master
        - dev

stages:
    - build
    - test
    - docker-build
    - deploy

build:
    stage: build
    image: node
    script:
        - echo "Start building App"
        - npm install
        - npm run build
        - echo "Build successfully!"
    artifacts:
        expire_in: 1 hour
        paths:
            - build
            - node_modules/

test:
    stage: test
    image: node
    script:
        - echo "Testing App"
        - echo "Test successfully!"

docker-build:
    stage: docker-build
    image: docker:latest
    services:
        - name: docker:24.0.7-dind
    before_script:
        - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    script:
        - docker build --pull -t "$CI_REGISTRY_IMAGE" .
        - docker push "$CI_REGISTRY_IMAGE"
        - echo "Registry image:" $CI_REGISTRY_IMAGE

deploy:
    stage: deploy
    image: kroniak/ssh-client
    before_script:
        - echo "deploying app"
    script:
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > key.pem
        - chmod 400 key.pem
        - ssh -o StrictHostKeyChecking=no -i key.pem root@$VM_IPADDRESS "hostname && echo 'Welcome!!!' > welcome.txt"
        - ssh -o StrictHostKeyChecking=no -i key.pem root@$VM_IPADDRESS "docker pull registry.gitlab.com/naavix/portfolio"
        - ssh -o StrictHostKeyChecking=no -i key.pem root@$VM_IPADDRESS "docker stop portfoliocontainer || true && docker rm portfoliocontainer || true"
        - ssh -o StrictHostKeyChecking=no -i key.pem root@$VM_IPADDRESS "docker run -p 3001:80 -d --name portfoliocontainer registry.gitlab.com/naavix/portfolio"

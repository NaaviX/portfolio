server {
    listen 80;
    server_name antoine-legrand.dev;    

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }    
}
server {
    listen 443 ssl;
    server_name antoine-legrand.dev;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_certificate /etc/letsencrypt/live/antoine-legrand.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antoine-legrand.dev/privkey.pem;
    
    location / {
        proxy_pass http://antoine-legrand.dev; #for demo purposes
    }
}